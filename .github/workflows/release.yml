name: THINC Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_gates:
        description: 'Skip lint/type/test gates (not recommended)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,release]'

      - name: Build documented release package (SHA-256 + SBOM)
        run: |
          python scripts/build_release.py ${{ inputs.skip_gates && '--skip-gates' || '' }}

      - name: Verify checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Verify the SBOM was produced by the pinned generator
        run: |
          python - <<'PY'
          import json
          manifest = json.load(open("dist/RELEASE_MANIFEST.json", encoding="utf-8"))
          sbom = manifest["sbom"]
          assert sbom["generator"] == "cyclonedx-py", f"SBOM fell back to {sbom['generator']}"
          assert sbom["components"] >= 5, f"SBOM looks too thin: {sbom['components']} components"
          print("SBOM generator:", sbom["generator"], "components:", sbom["components"])
          PY

      - name: Verify the published record describes a fully gated build
        run: |
          python - <<'PY'
          import json
          manifest = json.load(open("dist/RELEASE_MANIFEST.json", encoding="utf-8"))
          gates = manifest["quality_gates"]
          repro = manifest["reproducibility"]
          assert gates["status"] == "PASSED", f"quality gates were not run: {gates['status']}"
          assert gates["v4_2_selftest"]["failed"] == 0, gates["v4_2_selftest"]
          assert repro["verified"] is True, f"reproducibility not verified: {repro}"
          print("gates:", gates["status"], "| reproducible:", repro["method"])
          PY

      - name: Install the built wheel in a clean environment and smoke-test it
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/thinc_v4-*.whl
          /tmp/verify/bin/python -c "import thinc_v4, thinc_v4.v4_2 as v; print(thinc_v4.__version__, v.LAYER_VERSION)"
          /tmp/verify/bin/python -m thinc_v4.v4_2.master_framework --test > /tmp/selftest.json
          python -c "import json;r=json.load(open('/tmp/selftest.json'));assert r['failed']==0, r;print('wheel self-test OK', r['passed'])"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thinc-release-package
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/sbom.cyclonedx.json
            dist/RELEASE_MANIFEST.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error

      - name: Attach artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSETS=(dist/*.whl dist/*.tar.gz dist/SHA256SUMS
                  dist/sbom.cyclonedx.json dist/RELEASE_MANIFEST.json)

          # Deleting and re-pushing a tag turns its release into an orphaned
          # draft, so a plain "does a release exist?" check can end up editing a
          # detached draft and leaving the tag with no visible release. Only
          # reuse a release that is still attached to this tag and not a draft.
          reusable=false
          if gh release view "${GITHUB_REF_NAME}" --json tagName,isDraft > /tmp/release.json 2>/dev/null; then
            tag_name=$(jq -r '.tagName' /tmp/release.json)
            is_draft=$(jq -r '.isDraft' /tmp/release.json)
            if [ "${tag_name}" = "${GITHUB_REF_NAME}" ] && [ "${is_draft}" = "false" ]; then
              reusable=true
            else
              echo "::warning::Found a stale or draft release for ${GITHUB_REF_NAME} (tag=${tag_name}, draft=${is_draft}); recreating it."
              gh release delete "${GITHUB_REF_NAME}" --yes --cleanup-tag=false || true
            fi
          fi

          if [ "${reusable}" = "true" ]; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "THINC ${GITHUB_REF_NAME}" \
              --notes-file dist/RELEASE_NOTES.md \
              --draft=false --latest
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "THINC ${GITHUB_REF_NAME}" \
              --notes-file dist/RELEASE_NOTES.md \
              --verify-tag --latest \
              "${ASSETS[@]}"
          fi

      - name: Confirm exactly one published release for the tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq "[.[] | select(.tag_name == \"${GITHUB_REF_NAME}\")] | length")
          draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)
          echo "releases for ${GITHUB_REF_NAME}: ${count} (draft=${draft})"
          test "${count}" -eq 1
          test "${draft}" = "false"
