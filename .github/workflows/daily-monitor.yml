name: Karseell Daily Monitor

on:
  schedule:
    # 06:00 UTC = 09:00 Africa/Cairo (UTC+3)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  daily-monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Karseell Daily Monitor
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ vars.META_AD_ACCOUNT_ID }}
          META_ACTIVE_AD_ID: ${{ vars.META_ACTIVE_AD_ID }}
          SHOPIFY_STORE_URL: ${{ vars.SHOPIFY_STORE_URL }}
        run: python scripts/daily_monitor.py
