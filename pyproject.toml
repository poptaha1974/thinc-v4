[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinc-v4"
version = "4.0.0"
description = "THINC v4.0 — Invented by Dr. Ehab Taha"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dr. Ehab Taha" }]
dependencies = [
  "pandas==2.2.2",
  "streamlit==1.36.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "ruff==0.5.5",
  "mypy==1.10.1",
]

[project.scripts]
thinc-v4 = "thinc_v4.framework:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["thinc_v4_0_final_verified_20260620", "THINC_v4_0_Master_Framework (1).py", "*.zip"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "F403", "F405", "F401", "UP006", "UP009", "UP017", "UP035", "UP045", "I001", "B904"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
disable_error_code = ["unused-ignore", "redundant-cast", "untyped-decorator"]
exclude = ["thinc_v4_0_final_verified_20260620", "THINC_v4_0_Master_Framework \\(1\\).py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/thinc_v4"]
