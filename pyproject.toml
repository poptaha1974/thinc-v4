[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thinc-v4"
version = "4.2.0"
description = "THINC v4.2 — Creative Intelligence, Media Testing & Niche Governance — Invented by Dr. Ehab Taha"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dr. Ehab Taha" }]
dependencies = [
  "pandas==2.2.2",
  "streamlit==1.36.0",
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
  "pydantic==2.10.4",
]

[project.optional-dependencies]
dev = [
  "pytest==8.2.2",
  "pytest-cov==5.0.0",
  "ruff==0.5.5",
  "mypy==1.10.1",
  "httpx==0.28.1",
]
release = [
  "build==1.2.1",
  "cyclonedx-bom==7.3.1",
]

[project.scripts]
thinc-v4 = "thinc_v4.framework:main"
thinc-v4-2 = "thinc_v4.v4_2.media_runner:main"
thinc-v4-2-governance = "thinc_v4.v4_2.governance:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thinc_v4 = ["weights.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["thinc_v4_0_final_verified_20260620", "THINC_v4_0_Master_Framework (1).py", "*.zip"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "E402", "F403", "F405", "F401", "UP006", "UP009", "UP017", "UP035", "I001", "B904"]

[tool.mypy]
python_version = "3.11"
strict = true
# Pydantic models declare optional fields through Field(...) defaults, which the
# plugin teaches MyPy to read; without it every model constructor looks incomplete.
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
files = ["src", "services", "tests", "scripts"]
mypy_path = ["src"]
exclude = ["thinc_v4_0_final_verified_20260620", "THINC_v4_0_Master_Framework \\(1\\).py"]

# Test suites and operational scripts are checked, but the historic unittest
# style (v4.2 suites) and monitor scripts are not required to be fully annotated.
[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "scripts.*", "daily_monitor", "slack_test", "verify_governance"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/thinc_v4"]
